# Proxy cache (orgoj fork, templates/_assets.conf): never store 401/403/5xx.
# Checks the last upstream attempt after proxy_next_upstream retries ("502, 200").
# volatile: evaluated when proxy_no_cache runs, after the response header arrived.
map $upstream_status $cache_error_status {
	volatile;
	default                   "";
	"~(401|403|5[0-9][0-9])$" 1;
}
