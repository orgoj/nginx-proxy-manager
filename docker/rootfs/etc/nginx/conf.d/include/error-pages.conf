# Shared error pages for errors generated by nginx (backend down, access denied,
# unknown path on a 404 host). Errors returned by a backend pass through unchanged.
# Override per status in /data/nginx/error_pages/<status>.html or for all statuses
# in /data/nginx/error_pages/error.html; the built-in page is /var/www/errors/error.html.
error_page 400 401 403 404 405 408 413 414 429 500 502 503 504 /__npm_error/$status.html;

location ^~ /__npm_error/ {
	internal;
	root /;
	ssi on;
	default_type text/html;
	try_files /data/nginx/error_pages/$status.html /data/nginx/error_pages/error.html /var/www/errors/error.html =404;
}
