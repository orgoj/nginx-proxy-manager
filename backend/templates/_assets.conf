{% if cache_enabled -%}
  # Cache (orgoj fork): server level, so every location keeps its access
  # list and backend. Never stored: responses with Set-Cookie or Vary: *, 401/403/5xx,
  # responses to requests with Authorization, Upgrade or a Cookie (public paths: see below).
  # Authorization and Upgrade (WebSocket) requests never read the cache.
  # Cookie requests read the cache only under the public paths.
  set $cache_read_skip "";
  set $cache_store_skip "";
  if ($http_cookie) {
    set $cache_read_skip 1;
    set $cache_store_skip 1;
  }
{% if cache_public_regex != "" %}
  if ($uri ~ "^({{ cache_public_regex }})") {
    set $cache_read_skip "";
{% unless cache_edge %}
    set $cache_store_skip "";
{% endunless %}
  }
{% endif %}
{% unless cache_edge %}
  if ($uri !~* "\.(css|js|jpe?g|gif|png|webp|avif|woff2?|eot|ttf|otf|svg|ico|css\.map|js\.map)$") {
    set $cache_read_skip 1;
    set $cache_store_skip 1;
  }
{% endunless %}

  proxy_cache public-cache;
  proxy_cache_key "c1:{{ id }}:{{ cache_key_version }}:$scheme$host$request_uri";
  proxy_cache_lock on;
  proxy_cache_revalidate on;
  proxy_cache_bypass $http_authorization $http_upgrade $cache_read_skip;
  proxy_no_cache $http_authorization $http_upgrade $cache_store_skip $cache_error_status;
{% if cache_edge %}
  # Edge: anonymous responses only, for a short fixed time, even when the backend
  # marks them private/no-store (many apps do so for every page).
  proxy_ignore_headers Cache-Control Expires;
  proxy_cache_valid 200 {{ cache_edge_valid_200 }};
  proxy_cache_valid 301 302 {{ cache_edge_valid_301_302 }};
  proxy_cache_valid 404 {{ cache_edge_valid_404 }};
  proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
  proxy_next_upstream error timeout http_502 http_503;
{% else %}
  # Assets: backend Cache-Control/Expires honoured (private, no-store, no-cache never stored).
  proxy_cache_valid 200 {{ cache_asset_valid_200 }};
  proxy_cache_valid 404 {{ cache_asset_valid_404 }};
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
{% endif %}
{% endif %}
