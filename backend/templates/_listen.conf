  listen 80;
{% if ipv6 -%}
  listen [::]:80;
{% else -%}
  #listen [::]:80;
{% endif %}
{% if certificate -%}
  listen 443 ssl;
  listen 443 quic;
{% if ipv6 -%}
  listen [::]:443 ssl;
  listen [::]:443 quic;
{% else -%}
  #listen [::]:443;
{% endif %}
  more_set_headers 'Alt-Svc: h3=":443"; ma=86400';
{% endif %}
  server_name {{ domain_names | join: " " }};
{% if http2_support == 1 or http2_support == true %}
  http2 on;
{% else -%}
  http2 off;
{% endif %}